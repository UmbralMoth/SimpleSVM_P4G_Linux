name: Build SimpleSvm P4G Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build SimpleSvm.sys
      working-directory: ${{ github.workspace }}
      run: |
        msbuild SimpleSVM_P4G_Linux/SimpleSvm.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Verify Driver
      working-directory: ${{ github.workspace }}
      run: |
        if (Test-Path "SimpleSVM_P4G_Linux/x64/Release/SimpleSvm.sys") {
          Write-Host "Build successful: SimpleSVM_P4G_Linux/x64/Release/SimpleSvm.sys"
          # Copy to driver_amd for deployment
          Copy-Item "SimpleSVM_P4G_Linux/x64/Release/SimpleSvm.sys" "SimpleSVM_P4G_Linux/driver_amd/SimpleSvm.sys" -Force
        } else {
          Write-Error "Build failed: SimpleSvm.sys not found"
          exit 1
        }

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleSvm-P4G-Driver
        path: |
          SimpleSVM_P4G_Linux/x64/Release/SimpleSvm.sys
          SimpleSVM_P4G_Linux/driver_amd/SimpleSvm.sys
          SimpleSVM_P4G_Linux/reflex.ini
          SimpleSVM_P4G_Linux/reflex.dll
          SimpleSVM_P4G_Linux/reflex_amd
          SimpleSVM_P4G_Linux/reflex_intel
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          SimpleSVM_P4G_Linux/x64/Release/SimpleSvm.sys
          SimpleSVM_P4G_Linux/driver_amd/SimpleSvm.sys
          SimpleSVM_P4G_Linux/reflex.ini
          SimpleSVM_P4G_Linux/reflex.dll
          SimpleSVM_P4G_Linux/reflex_amd
          SimpleSVM_P4G_Linux/reflex_intel
        draft: false
        prerelease: false